name: Dashboard Update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailflare-source-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'mjfrancese/mailflare' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UPDATE_SOURCE_REPOSITORY: hieunc229/mailflare

    steps:
      - name: Check update token
        env:
          UPDATE_TOKEN: ${{ secrets.MAILFLARE_UPDATE_TOKEN }}
        run: |
          if [ -z "${UPDATE_TOKEN}" ]; then
            echo "::error::Add MAILFLARE_UPDATE_TOKEN as a repository Actions secret."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.MAILFLARE_UPDATE_TOKEN }}

      - name: Replace repository with upstream source
        run: |
          set -euo pipefail
          git config user.name "mailflare-update"
          git config user.email "mailflare-update@users.noreply.github.com"

          # These two installation-owned files are the trusted updater and
          # generic Cloudflare config overlay. Preserve their exact bytes.
          preserved_dir="$(mktemp -d)"
          trap 'rm -rf "$preserved_dir"' EXIT
          mkdir -p "$preserved_dir/.github/workflows" "$preserved_dir/.github/installation"
          cp .github/workflows/deploy-update.yml "$preserved_dir/.github/workflows/deploy-update.yml"
          cp .github/installation/prepare-deploy.mjs "$preserved_dir/.github/installation/prepare-deploy.mjs"

          upstream_url="https://github.com/${UPDATE_SOURCE_REPOSITORY}.git"
          git remote add upstream "${upstream_url}"
          git fetch --no-tags upstream
          upstream_branch="$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          if [ -z "${upstream_branch}" ]; then
            echo "::error::Could not resolve the default branch of ${UPDATE_SOURCE_REPOSITORY}."
            exit 1
          fi
          upstream_ref="upstream/${upstream_branch}"
          echo "Replacing main with ${upstream_ref}."

          upstream_commit="$(git rev-parse "${upstream_ref}")"
          echo "Upstream commit: ${upstream_commit}"
          git read-tree --reset -u "${upstream_commit}"
          # Refuse any upstream workflow additions or replacements. Only
          # this installation-owned workflow may run in this repository.
          unexpected_workflows="$(find .github/workflows -mindepth 1 -maxdepth 1 ! -name deploy-update.yml -print 2>/dev/null || true)"
          if [ -n "${unexpected_workflows}" ]; then
            echo "::error::Upstream introduced unexpected workflow files: ${unexpected_workflows}"
            exit 1
          fi

          mkdir -p .github/workflows .github/installation
          cp "$preserved_dir/.github/workflows/deploy-update.yml" .github/workflows/deploy-update.yml
          cp "$preserved_dir/.github/installation/prepare-deploy.mjs" .github/installation/prepare-deploy.mjs
          git add -f .github/workflows/deploy-update.yml .github/installation/prepare-deploy.mjs
          if git diff --cached --quiet; then
            echo "Repository is already up to date."
            exit 0
          fi
          git commit -m "Update Mailflare from ${UPDATE_SOURCE_REPOSITORY}@${upstream_commit}"

      - name: Push update
        run: |
          set -euo pipefail
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "Repository is already up to date."
            exit 0
          fi
          git push origin HEAD:main
